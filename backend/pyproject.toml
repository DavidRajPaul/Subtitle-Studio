[project]
name = "subtitle-studio-backend"
version = "0.1.0"
description = "Local FastAPI backend for Subtitle Studio"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "faster-whisper>=1.1,<2",
    "python-multipart>=0.0.9,<1",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "mypy>=1.11,<2",
    "pytest>=8.3,<9",
    "ruff>=0.6,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
# Grammar for reading third-party stubs (NumPy uses 3.12 syntax); ruff keeps our code 3.11-compatible.
python_version = "3.12"
files = ["app", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.mypy.overrides]]
module = ["faster_whisper", "faster_whisper.*", "numpy", "numpy.*", "ctranslate2", "ctranslate2.*", "av", "av.*"]
ignore_missing_imports = true
follow_imports = "skip"
