name: Publish web app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        run: pnpm --dir frontend install --frozen-lockfile
      - name: Lint, type-check and test
        run: |
          pnpm --dir frontend lint
          pnpm --dir frontend typecheck
          pnpm --dir frontend test
      - name: Build for https://<owner>.github.io/<repository>/
        run: pnpm --dir frontend build
        env:
          SUBTITLE_STUDIO_BASE: /${{ github.event.repository.name }}/
      - name: Browser regression tests (phone and desktop)
        run: |
          pnpm --dir frontend exec playwright install --with-deps chromium
          pnpm --dir frontend e2e
        env:
          SUBTITLE_STUDIO_BASE: /${{ github.event.repository.name }}/
      - name: Keep the browser test report when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 14
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
